# Reference snippet only — as of the Terraform-native redesign, these
# annotations are generated directly inside
# terraform/modules/logging-platform/order-api.tf's
# kubernetes_deployment_v1.order_api resource, not read from this file.
# Kept here purely as documentation for wiring up Vault Agent injection
# on any future workload outside this project.
#
# The Vault Agent sidecar injector reads these and mounts rendered
# secrets at /vault/secrets/*, so the app never talks to Vault's API
# directly. The injector itself comes up automatically as part of
# `terraform apply` — see terraform/modules/logging-platform/vault.tf
# (helm_release.vault, injector.enabled = true).
metadata:
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/auth-path: "auth/kubernetes-<env>" # e.g. auth/kubernetes-prod — see scripts/vault-bootstrap.sh
    vault.hashicorp.com/role: "order-api"
    vault.hashicorp.com/agent-inject-secret-config.env: "secret/data/logging-eks-<env>/order-api"
    vault.hashicorp.com/agent-inject-template-config.env: |
      {{- with secret "secret/data/logging-eks-<env>/order-api" -}}
      DB_PASSWORD={{ .Data.data.db_password }}
      EXTERNAL_API_KEY={{ .Data.data.external_api_key }}
      {{- end -}}
